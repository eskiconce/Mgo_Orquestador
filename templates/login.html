<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MundoGo-Plus | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 10px; }
        .logo-img { max-width: 150px; height: auto; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="card shadow login-card border-0">
        <div class="text-center mb-4">
            <img src="/static/logo.png" alt="MundoGo! Logo" class="logo-img">
            <h4 class="fw-bold text-dark">MundoGo-Plus</h4>
            <small class="text-muted">Acceso TV Manager</small>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 text-center small">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Ej: admin" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="••••••" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">INGRESAR <i class="fas fa-sign-in-alt ms-2"></i></button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">&copy; 2026 Mundo.Service</small>
        </div>
    </div>
</body>
</html>
