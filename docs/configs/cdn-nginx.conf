# /etc/nginx/nginx.conf - CDN Edge (dual platform: cdn-live + live)

user www-data;
worker_processes auto;
worker_rlimit_nofile 200000;
pcre_jit on;

pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
  use epoll;
  worker_connections 65535;
  multi_accept on;
}

http {

        open_file_cache          max=200000 inactive=30s;
        open_file_cache_valid    60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors   on;

        client_body_buffer_size      128k;
        client_max_body_size         10m;
        client_header_buffer_size    1k;
        large_client_header_buffers  4 4k;
        output_buffers               1 32k;
        postpone_output              1460;

        client_header_timeout  10;
        client_body_timeout    10;
        send_timeout           10;
        keepalive_timeout      30;
        keepalive_requests     1000;

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        sendfile        on;
        tcp_nopush      on;
        tcp_nodelay     on;

  log_format custom_log_format '"$remote_addr";"$upstream_cache_status [$time_local]";"$http_referer";'
                           '"$request";"$status";"$body_bytes_sent";'
                           '"$upstream_response_time";'
                            '"$http_user_agent"';

  access_log /var/log/nginx/cdn_ccp.log custom_log_format;
  error_log  /var/log/nginx/cdn_error.log  warn;

        server_names_hash_bucket_size 64;
        server_names_hash_max_size 512;
        reset_timedout_connection on;

  # ---------------------------------------------------------------
  # CACHE ZONES - Plataforma Actual (cdn-live.mundogo.cl)
  # ---------------------------------------------------------------
  upstream contenido {
      server haproxy.mundogo.cl;
  }

  proxy_cache_path /datacache/mundogo levels=1:2 keys_zone=cache_mundogo:200m inactive=720h max_size=4000g use_temp_path=off;

  # ---------------------------------------------------------------
  # CACHE ZONES - Plataforma Nueva (live.mundogo.cl + vod)
  # ---------------------------------------------------------------
  proxy_cache_path /datacache/mundogoplus levels=1:2 keys_zone=cache_mundogoplus:200m inactive=240h max_size=2000g use_temp_path=off;
  proxy_cache_path /datacache/mundogovod  levels=1:2 keys_zone=cache_mundogovod:200m  inactive=120h max_size=1000g use_temp_path=off;

  # ---------------------------------------------------------------
  # UPSTREAM KEEPALIVE - CDN → HAProxy
  # Elimina TCP overhead por request: conexiones reutilizadas
  # 1024 = suficiente para 50k+ clientes simultáneos
  # ---------------------------------------------------------------
  upstream ha-origin_backend {
      server ha-origin.mundogo.cl:80 max_conns=200000;
      keepalive 1024;
  }

  # ===============================================================
  # SERVER: cdn-live.mundogo.cl (Plataforma Actual - SIN CAMBIOS)
  # ===============================================================
  server {

    server_name cdn-live.mundogo.cl;
    listen 10.80.8.6:443 ssl;
    listen 10.85.105.42:80;
    listen 127.0.0.1:80;
    ssl_certificate /opt/certificados/nginx/mundo.pem;
    ssl_certificate_key /opt/certificados/nginx/mundo.key;
    ssl_session_cache shared:SSL_cdn_company_com:50m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_early_data on;

      location /
      {
        proxy_cache cache_mundogo;
        proxy_pass http://contenido;

        if ($request_method = OPTIONS ) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Origin, Range, Content-Type, Accept';
            add_header 'Access-Control-Max-Age' 3600;
            return 204;
        }

        proxy_next_upstream error timeout;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update off;
        proxy_connect_timeout 10s;
        proxy_cache_min_uses 1;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 15s;
        proxy_cache_key $scheme$proxy_host$request_uri;
        proxy_cache_revalidate on;
        proxy_cache_valid 404      30s;
        proxy_cache_valid 502      10s;
        proxy_cache_valid 503      10s;
        proxy_ignore_client_abort on;
        proxy_buffering on;

        proxy_http_version 1.1;
        proxy_set_header        Host                    live-tcsccp.thechannel.store;
      }

      location = /stub_status {
       stub_status on;
       allow 127.0.0.1;
       deny all;
      }
  }

  # ===============================================================
  # SERVER: live.mundogo.cl (Plataforma Nueva - OPTIMIZADO)
  # ===============================================================
  server {
    server_name live.mundogo.cl;
    listen 10.80.8.6:443 ssl;
    listen 10.85.105.42:80;
    listen 127.0.0.1:80;
    ssl_certificate /opt/certificados/nginx/mundo.pem;
    ssl_certificate_key /opt/certificados/nginx/mundo.key;
    ssl_session_cache shared:SSL_cdn_company_com:50m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_early_data on;

    location / {
        proxy_cache cache_mundogoplus;
        proxy_pass http://ha-origin_backend;
        proxy_set_header Host $host;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
        add_header 'Accept-Ranges' 'bytes' always;
        add_header 'X-Cache-Status' $upstream_cache_status always;

        # =========================================================
        # MANIFIESTOS - TTL 2s + stale-while-revalidate
        # =========================================================
        location ~* \.(mpd|m3u8)$ {
            proxy_cache cache_mundogoplus;
            proxy_pass http://ha-origin_backend;

            proxy_buffering on;
            gzip off;

            proxy_cache_valid 200 2s;

            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Expose-Headers';
            proxy_hide_header 'Access-Control-Allow-Credentials';

            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires;

            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_age 1s;
            proxy_cache_lock_timeout 2s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_revalidate on;

            add_header Cache-Control "public, max-age=3, stale-while-revalidate=10" always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
            add_header 'Accept-Ranges' 'bytes' always;
            add_header 'X-Cache-Status' $upstream_cache_status always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Range, Content-Type, Accept, Authorization' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Length' 0 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                return 204;
            }
        }

        # =========================================================
        # INIT SEGMENTS - TTL 30s (controlado por X-Accel-Expires)
        # =========================================================
        location ~* _init\.mp4$ {
            proxy_cache cache_mundogoplus;
            proxy_pass http://ha-origin_backend;

            proxy_cache_valid 200 30s;
            proxy_cache_revalidate on;

            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Expose-Headers';
            proxy_hide_header 'Access-Control-Allow-Credentials';
            proxy_hide_header Set-Cookie;

            proxy_ignore_headers Expires Cache-Control Set-Cookie Vary;
            proxy_cache_key "$scheme$proxy_host$uri";

            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_age 1s;
            proxy_cache_lock_timeout 2s;
            proxy_cache_use_stale error timeout updating;

            add_header Cache-Control "public, max-age=30, stale-while-revalidate=604800" always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
            add_header 'Accept-Ranges' 'bytes' always;
            add_header 'X-Cache-Status' $upstream_cache_status always;
        }

        # =========================================================
        # SEGMENTOS VIDEO/AUDIO - TTL según X-Accel-Expires del origin
        # Live: 30s | Catchup: 6h (controlado por el origin)
        # =========================================================
        location ~* \.(m4s|mp4|ts)$ {
            proxy_cache cache_mundogoplus;
            proxy_pass http://ha-origin_backend;

            proxy_cache_valid 200 30s;

            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Expose-Headers';
            proxy_hide_header 'Access-Control-Allow-Credentials';
            proxy_hide_header Set-Cookie;

            proxy_ignore_headers Expires Cache-Control Set-Cookie Vary;
            proxy_cache_key "$scheme$proxy_host$uri";
            proxy_cache_revalidate on;

            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_age 1s;
            proxy_cache_lock_timeout 2s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            add_header Cache-Control "public, stale-while-revalidate=604800" always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
            add_header 'Accept-Ranges' 'bytes' always;
            add_header 'X-Cache-Status' $upstream_cache_status always;
        }

        # Settings generales
        proxy_next_upstream error timeout;
        proxy_set_header Connection "";
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_connect_timeout 10s;
        proxy_cache_min_uses 1;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_lock_age 1s;
        proxy_cache_key $scheme$proxy_host$request_uri;
        proxy_cache_revalidate on;
        proxy_cache_valid 404 30s;
        proxy_cache_valid 500 502 503 10s;
        proxy_ignore_client_abort on;
        proxy_buffering on;
        proxy_http_version 1.1;
    }
}

}
#### fin de configuracion ####
