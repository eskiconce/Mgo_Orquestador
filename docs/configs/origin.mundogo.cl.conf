# Origin NGINX - Live + Catchup
# /etc/nginx/sites-available/origin.mundogo.cl

server {
    listen 80;
    server_name origin.mundogo.cl ha-origin.mundogo.cl;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_types application/dash+xml application/vnd.apple.mpegurl text/plain;

    include mime.types;
    types {
        application/dash+xml mpd;
        video/iso.segment m4s;
    }

    # =============================================================
    # MANIFIESTOS - siempre desde RAM, caché ultra corto
    # =============================================================
    location ~* \.(mpd|m3u8)$ {
        root /mnt/live_ram;
        try_files $uri @catchup_disk_manifest;

        expires 2s;
        add_header Cache-Control "public, max-age=2" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    }

    location @catchup_disk_manifest {
        root /storage/live;
        aio threads;
        directio 512k;

        expires 2s;
        add_header Cache-Control "public, max-age=2" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    }

    # =============================================================
    # SEGMENTOS LIVE - RAM disk → cache 30s
    # error_page 404 redirige a catchup si no está en RAM
    # =============================================================
    location ~* \.(m4s|mp4|ts|m4a)$ {
        root /mnt/live_ram;
        directio off;

        error_page 404 = @catchup_disk;

        add_header X-Accel-Expires 30 always;
        add_header X-Segment-Type "live" always;
        add_header Cache-Control "public, max-age=30" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    }

    # =============================================================
    # SEGMENTOS CATCHUP - disco físico → cache 6h
    # =============================================================
    location @catchup_disk {
        root /storage/live;
        aio threads;
        directio 512k;

        add_header X-Accel-Expires 21600 always;
        add_header X-Segment-Type "catchup" always;
        add_header Cache-Control "public, max-age=21600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    }

    # =============================================================
    # HEALTHCHECK
    # =============================================================
    location = /stub_status {
        stub_status on;
        allow 127.0.0.1;
        allow 172.31.203.98;
        allow 172.31.203.99;
        allow 172.31.203.100;
        deny all;
    }

    location / {
        root /storage/live;
        try_files $uri $uri/ =404;
    }

    access_log /storage/logs/nginx/origin-access.log;
    error_log /storage/logs/nginx/origin-error.log;
}
